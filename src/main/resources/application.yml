# ============================================================
# AiKnow Application Configuration
# ============================================================

spring:
  application:
    name: aiknow

  # --- Database ---
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/aiknow}
    username: ${DATABASE_USERNAME:aiknow}
    password: ${DATABASE_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  # --- JPA / Hibernate ---
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC

  # --- Liquibase ---
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

  # --- Jackson ---
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  # --- Servlet ---
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# ============================================================
# Application Properties
# ============================================================
app:
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-change-in-production-min-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

  gemini:
    api-key: ${GEMINI_API_KEY:}
    chat-model: ${GEMINI_CHAT_MODEL:gemini-2.5-flash}
    embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-2}

  storage:
    upload-dir: ${FILE_STORAGE_PATH:./uploads}

# ============================================================
# Logging
# ============================================================
logging:
  level:
    com.aiknow: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.liquibase: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ============================================================
# Server
# ============================================================
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
