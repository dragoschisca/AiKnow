version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: aiknow-postgres
    environment:
      POSTGRES_DB: aiknow
      POSTGRES_USER: aiknow
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiknow -d aiknow"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
